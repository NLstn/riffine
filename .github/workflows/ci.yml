name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/riffine
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l adapters cmd core internal)"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: sh scripts/build-browser-practice.sh
      - run: |
          sh scripts/build-host-spike.sh portable
          mkdir -p bin
          go build -o bin/riffine ./cmd/riffine
          node scripts/check-browser-practice.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check M4A and Opus import, seeking and saved projects
        run: node scripts/check-browser-codecs.mjs --media-only
      - run: node scripts/check-browser-output.mjs
      - run: node scripts/check-browser-presentation.mjs
      - run: node scripts/check-browser-boundary.mjs
      - run: node scripts/check-browser-live-host.mjs
      - run: node --experimental-strip-types scripts/check-practice-facade.mjs
      - run: node --experimental-strip-types scripts/check-practice-shortcuts.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure --no-tests=error
      - if: runner.os == 'macOS'
        name: Check native presentation ownership with ThreadSanitizer
        run: |
          cmake -S native -B build/native-tsan -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread' \
            "-DFETCHCONTENT_SOURCE_DIR_MINIAUDIO=$PWD/build/native/_deps/miniaudio-src" \
            "-DFETCHCONTENT_SOURCE_DIR_SIGNALSMITH-LINEAR=$PWD/build/native/_deps/signalsmith-linear-src" \
            "-DFETCHCONTENT_SOURCE_DIR_SIGNALSMITH-STRETCH=$PWD/build/native/_deps/signalsmith-stretch-src"
          cmake --build build/native-tsan --target riffine-presentation-queue-test riffine-device-clock-test --parallel 2
          ctest --test-dir build/native-tsan -R 'native-presentation-queue|native-device-clock' --output-on-failure --no-tests=error
        env:
          TSAN_OPTIONS: halt_on_error=1
      - run: cmake --install build/native --config Release --prefix build/package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RIFFINE_AUDIO_HELPER = (Resolve-Path build/package/bin/riffine-audio.exe).Path
          go test -count=1 -v ./adapters/native ./internal/cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o build/package/bin/riffine.exe ./cmd/riffine
      - if: runner.os != 'Windows'
        run: |
          export RIFFINE_AUDIO_HELPER="$PWD/build/package/bin/riffine-audio"
          go test -count=1 -v ./adapters/native ./internal/cli
          go build -trimpath -o build/package/bin/riffine ./cmd/riffine
      - shell: bash
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md build/package/
          cp "$(go env GOROOT)/LICENSE" build/package/licenses/go-LICENSE
          cp "$(go env GOROOT)/PATENTS" build/package/licenses/go-PATENTS
      - uses: actions/upload-artifact@v7
        with:
          name: riffine-cli-${{ runner.os }}-${{ runner.arch }}
          path: build/package/
  native_safety:
    name: native-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build scheduled worker with memory/undefined-behavior checks
        run: |
          cmake -S native -B build/native-safety -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build/native-safety --target riffine-scheduled-test riffine-stream-abi-test riffine-presentation-queue-test riffine-device-clock-test riffine-rate-selection-test riffine-audio --parallel 2
      - run: ctest --test-dir build/native-safety -R 'bounded-scheduled-worker|streaming-c-abi|native-presentation-queue|native-device-clock|device-rate-selection-processing' --output-on-failure --no-tests=error
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Exercise persistent native control under memory checks
        run: go test -count=1 -run 'TestNativeScheduledWorker|TestNativeControl' ./adapters/native
        env:
          RIFFINE_AUDIO_HELPER: ${{ github.workspace }}/build/native-safety/riffine-audio
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  required:
    if: always()
    needs: [core, native, web, native_safety]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a CI job did not succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WEB_RESULT: ${{ needs.web.result }}
          NATIVE_SAFETY_RESULT: ${{ needs.native_safety.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$WEB_RESULT" = success
          test "$NATIVE_SAFETY_RESULT" = success
