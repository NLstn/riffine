name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/riffine
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l adapters cmd core internal)"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure --no-tests=error
      - run: cmake --install build/native --config Release --prefix build/package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:RIFFINE_AUDIO_HELPER = (Resolve-Path build/package/bin/riffine-audio.exe).Path
          go test -count=1 -v ./adapters/native ./internal/cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o build/package/bin/riffine.exe ./cmd/riffine
      - if: runner.os != 'Windows'
        run: |
          export RIFFINE_AUDIO_HELPER="$PWD/build/package/bin/riffine-audio"
          go test -count=1 -v ./adapters/native ./internal/cli
          go build -trimpath -o build/package/bin/riffine ./cmd/riffine
      - shell: bash
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md build/package/
          cp "$(go env GOROOT)/LICENSE" build/package/licenses/go-LICENSE
          cp "$(go env GOROOT)/PATENTS" build/package/licenses/go-PATENTS
      - uses: actions/upload-artifact@v7
        with:
          name: riffine-cli-${{ runner.os }}-${{ runner.arch }}
          path: build/package/
  required:
    if: always()
    needs: [core, native, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a CI job did not succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$WEB_RESULT" = success
