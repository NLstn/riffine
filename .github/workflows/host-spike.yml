name: Host feasibility spike
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: test -z "$(gofmt -l spikes)"
      - run: sh scripts/build-host-spike.sh portable
      - run: RIFFINE_SPIKE_OUT=build/host-spike/native sh scripts/build-host-spike.sh native
      - run: node spikes/browser/check.mjs
      - name: Compare native C ABI and Go reports
        run: |
          build/host-spike/host-spike < core/practice/testdata/session-v1.json > build/host-spike/go-report.json
          build/host-spike/native/mobile-runner core/practice/testdata/session-v1.json > build/host-spike/c-report.json
          diff -u build/host-spike/go-report.json build/host-spike/c-report.json
  ios-runtime:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - run: sh scripts/build-host-spike.sh portable
      - run: RIFFINE_SPIKE_OUT=build/host-spike/ios sh scripts/build-host-spike.sh ios
      - run: python3 -m unittest discover -s scripts -p 'test_check_ios_spike.py'
      - run: python3 scripts/check-ios-spike.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-runtime-evidence
          path: |
            build/host-spike/ios/report.json
            build/host-spike/ios/metrics.json
            build/host-spike/ios/simulator.log
          if-no-files-found: warn

  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      RIFFINE_NDK_HOST_TAG: linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned NDK and emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724" "emulator" "system-images;android-35;google_apis;x86_64"
      - run: sh scripts/build-host-spike.sh portable
      - name: Build arm64 Android C ABI
        run: RIFFINE_SPIKE_OUT=build/host-spike/android-arm64 sh scripts/build-host-spike.sh android
      - name: Build x86_64 Android C ABI for emulator execution
        run: RIFFINE_ANDROID_ARCH=amd64 RIFFINE_SPIKE_OUT=build/host-spike/android-amd64 sh scripts/build-host-spike.sh android
      - name: Execute repeated C-to-Go conformance on Android
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/riffine-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name riffine-ci --package "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee build/host-spike/android-amd64/avds.txt
          test -f "$ANDROID_AVD_HOME/riffine-ci.ini"
          trap '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd riffine-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >build/host-spike/android-amd64/emulator.log 2>&1 &
          python3 scripts/check-android-spike.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-runtime-evidence
          path: |
            build/host-spike/android-amd64/report.json
            build/host-spike/android-amd64/metrics.json
            build/host-spike/android-amd64/emulator.log
          if-no-files-found: warn

  cpp-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Activate pinned Emscripten 4.0.14
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/riffine-emsdk"
          git -C "$RUNNER_TEMP/riffine-emsdk" checkout eff90ca04a3785f571a8095b3a42b63799cf384a
          "$RUNNER_TEMP/riffine-emsdk/emsdk" install 4.0.14
          "$RUNNER_TEMP/riffine-emsdk/emsdk" activate 4.0.14
      - run: npm ci
        working-directory: web
      - run: node scripts/build-browser-media.mjs
      - name: Compare native and worker WASM streaming DSP
        run: |
          source "$RUNNER_TEMP/riffine-emsdk/emsdk_env.sh"
          sh scripts/build-wasm-dsp-spike.sh
          sh scripts/build-browser-dsp.sh
          node scripts/check-browser-selection.mjs build/wasm-dsp-native/selection-probe > build/browser-dsp/metrics.json
          cmake -S native -B build/rate-selection-native -DCMAKE_BUILD_TYPE=Release \
            "-DFETCHCONTENT_SOURCE_DIR_MINIAUDIO=$PWD/build/browser-dsp/_deps/miniaudio-src" \
            "-DFETCHCONTENT_SOURCE_DIR_SIGNALSMITH-LINEAR=$PWD/build/browser-dsp/_deps/signalsmith-linear-src" \
            "-DFETCHCONTENT_SOURCE_DIR_SIGNALSMITH-STRETCH=$PWD/build/browser-dsp/_deps/signalsmith-stretch-src"
          cmake --build build/rate-selection-native --target riffine-rate-selection-test riffine-click-test riffine-audio --parallel 2
          node scripts/check-browser-clicks.mjs build/rate-selection-native/riffine-click-test > build/browser-dsp/clicks.json
          node scripts/check-browser-rate-selection.mjs build/rate-selection-native/riffine-rate-selection-test > build/browser-dsp/rate-selection.json
          node scripts/check-browser-schedules.mjs > build/browser-dsp/schedules.json
          sh scripts/build-browser-practice.sh
          go run ./cmd/riffine tone --out build/browser-conformance.wav --seconds 1
          node scripts/check-browser-codecs.mjs build/rate-selection-native/riffine-audio > build/browser-dsp/codecs.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.mp3 node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-mp3.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.mp3 RIFFINE_LIVE_PLAN=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/saved-plan-mp3.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.flac node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-flac.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.m4a node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-m4a.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.opus node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-opus.json
          RIFFINE_LIVE_SOURCE=native/testdata/generated-stereo.opus RIFFINE_LIVE_PLAN=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/saved-plan-opus.json
          node scripts/check-browser-preview.mjs > build/browser-dsp/preview.json
          node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-binding.json
          RIFFINE_LIVE_ACTIONS=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/practice-actions.json
          RIFFINE_LIVE_PLAN=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/saved-plan.json
          RIFFINE_LIVE_CUES=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/cues.json
          RIFFINE_LIVE_BEATS=1 node scripts/check-browser-live-binding.mjs > build/browser-dsp/beat-markers.json
          RIFFINE_LIVE_SPEED=1 RIFFINE_LIVE_PITCH=0 node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-binding-normal.json
          RIFFINE_LIVE_SPEED=.25 RIFFINE_LIVE_PITCH=-12 node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-binding-min.json
          RIFFINE_LIVE_SPEED=2 RIFFINE_LIVE_PITCH=12 node scripts/check-browser-live-binding.mjs > build/browser-dsp/live-binding-max.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-wasm-streaming-evidence
          path: |
            build/wasm-dsp/report.json
            build/wasm-dsp/metrics.json
            build/browser-dsp/metrics.json
            build/browser-dsp/preview.json
            build/browser-dsp/codecs.json
            build/browser-dsp/live-mp3.json
            build/browser-dsp/live-flac.json
            build/browser-dsp/live-m4a.json
            build/browser-dsp/live-opus.json
            build/browser-dsp/saved-plan-mp3.json
            build/browser-dsp/saved-plan-opus.json
            build/browser-dsp/schedules.json
            build/browser-dsp/rate-selection.json
            build/browser-dsp/clicks.json
            build/browser-dsp/practice-actions.json
            build/browser-dsp/saved-plan.json
            build/browser-dsp/cues.json
            build/browser-dsp/beat-markers.json
            build/browser-dsp/live-binding.json
            build/browser-dsp/live-binding-normal.json
            build/browser-dsp/live-binding-min.json
            build/browser-dsp/live-binding-max.json
          if-no-files-found: warn
