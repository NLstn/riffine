name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build shared browser core and demo
        run: sh scripts/build-browser-practice.sh
      - name: Build pinned browser audio processing engine
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/riffine-pages-emsdk"
          git -C "$RUNNER_TEMP/riffine-pages-emsdk" checkout eff90ca04a3785f571a8095b3a42b63799cf384a
          "$RUNNER_TEMP/riffine-pages-emsdk/emsdk" install 4.0.14
          "$RUNNER_TEMP/riffine-pages-emsdk/emsdk" activate 4.0.14
          source "$RUNNER_TEMP/riffine-pages-emsdk/emsdk_env.sh"
          sh scripts/build-browser-dsp.sh
      - name: Build for the repository Pages path
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm --prefix web run build -- --base "$PAGES_BASE"
      - name: Verify scoped offline shell and isolation headers
        run: |
          node scripts/check-browser-offline.mjs
          node --experimental-strip-types scripts/check-browser-startup.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy tested web build
        id: deployment
        uses: actions/deploy-pages@v5
